name: publish

# Stages forge-terminal on npm when a v<version> tag is pushed, with
# provenance: npm shows that the package was built here, from this commit.
#
# Staged, not published: the version sits on npm, invisible to users, until
# a maintainer approves it with 2FA. A compromised GitHub account or workflow
# can stage a release but can never ship one.
#
# It authenticates with npm's trusted publishing (OIDC), so no npm token is
# stored anywhere. The trusted publisher on npmjs.com is GitHub Actions,
# AtharvaN16/forge-terminal, publish.yml, with "Allow npm publish" off: this
# workflow can only stage.
#
# Release: merge to main, bump the version, run `npm test` locally (CI
# skips tests/shell), then
#   git tag v<version> && git push origin v<version>
# (or v<version>-next to stage it under the `next` dist-tag; see below)
# and once the run is green, approve it from your own machine:
#   npm stage list forge-terminal
#   npm stage approve <stage-id>        (asks for your 2FA code)
# Do not also run `npm publish` locally.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # v<version> stages under `latest`. v<version>-next stages the same
      # version under `next`: `npm i -g forge-terminal@next` gets it, while
      # `npm i -g forge-terminal` and the update check (which reads `latest`)
      # do not, until `npm dist-tag add forge-terminal@<version> latest`.
      # A pre-release version (1.2.0-beta.0) always goes under `next`; npm
      # refuses one with no explicit tag anyway.
      - name: The tag is this version, on main
        shell: bash
        run: |
          want="v$(node -p 'require("./package.json").version')"
          tag="$GITHUB_REF_NAME"
          dist=latest
          if [[ "$want" == *-* ]]; then dist=next; fi
          if [ "$tag" = "$want-next" ]; then tag="$want"; dist=next; fi
          if [ "$tag" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1
          fi
          echo "DIST_TAG=$dist" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main"; exit 1
          }

      - run: npm ci

      # What prepublishOnly runs, as steps so each shows on its own, minus
      # tests/shell: those drive the Ink UI with keypresses on a clock, and
      # GitHub's Macs are slow enough that some fail every time (v0.2.1's
      # first run). Run the whole suite locally before tagging; bring
      # tests/shell back here once it is reliable on a runner.
      # The transcribe helper is Swift, built here (macos-26 has the SDK it
      # needs); a release without it would ship transcribe broken.
      - run: npm run build
        env:
          FORGE_REQUIRE_HELPERS: '1'
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --retry=2 --exclude 'tests/shell/**'

      # npm 11.19.0 is the version `npm stage` was checked on. Node 24's
      # bundled npm may be older than the command.
      - run: npm install -g npm@11.19.0

      # --ignore-scripts: prepublishOnly would run the checks above again.
      # DIST_TAG comes from the tag check above.
      - run: npm stage publish --provenance --access public --ignore-scripts --tag "$DIST_TAG"
