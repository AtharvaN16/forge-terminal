name: test
on:
  push:
    branches: [dev, main, 'feat/**']
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The lazy-load, bundle and boot tests record imports through
          # module.registerHooks, which needs Node 22.15 or later.
          node-version: 24
          cache: npm
      - run: npm ci
      # ffmpeg on every runner, so the video and sound tests (and the format
      # matrix's media rows, tests/parity) run instead of skipping. Forge finds
      # it on PATH, as it would a user's own copy.
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: command -v ffmpeg || brew install ffmpeg
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Windows: a pinned gyan.dev essentials build (the one Chocolatey wraps),
      # cached by version so it downloads once.
      - name: ffmpeg cache (Windows)
        if: runner.os == 'Windows'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~\ffmpeg
          key: ffmpeg-7.1.1-essentials-windows
      - name: ffmpeg download (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Move-Item "$env:RUNNER_TEMP\ffmpeg-7.1.1-essentials_build" "$HOME\ffmpeg"
      - name: ffmpeg on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$HOME\ffmpeg\bin"
      - run: ffmpeg -hide_banner -version
      - run: npm run typecheck
      - run: npm run lint
      - if: runner.os != 'Windows'
        run: npm test
      # On Windows the Ink screen tests (tests/shell) are not blocking. They
      # wait for frames with fixed settle() sleeps, and on the Windows runners
      # those sleeps lose their timing race: different tests fail on each run
      # of identical code (CI run 38322041038 and its re-run). The rest of the
      # suite stays blocking; the screen tests still run, so their results
      # stay visible. The real fix is replacing the settle() sleeps with
      # waitFor pollers, as vitest.config.ts notes.
      # bash, not PowerShell: npm's .ps1 shim can swallow the `--`.
      - if: runner.os == 'Windows'
        shell: bash
        run: npm test -- --exclude 'tests/shell/**'
      - name: Ink screen tests (non-blocking)
        if: runner.os == 'Windows' && !cancelled()
        continue-on-error: true
        run: npx vitest run tests/shell
