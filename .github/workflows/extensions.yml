name: extensions

# Release process (the catalogue in src/extensions/catalog.ts is the truth):
#
#   1. The archives the catalogue's sha256 values describe are kept in
#      ~/Developer/forge-release-assets/ext-v1.0.0/. Publish exactly those:
#        gh release create ext-<id>-v<version> <those .tar.gz files>
#   2. This workflow then rebuilds from source as a check. It never replaces
#      a published asset (no --clobber, ever): a rebuilt archive whose sha256
#      differs from the catalogue fails the job, and an asset already on the
#      release is downloaded and verified against the catalogue instead of
#      overwritten. Only an archive the catalogue does not list (boost's
#      other versions, built but not offered) and the release does not have
#      is uploaded.
#      Adding a platform to a published version works the same way: the
#      catalogue lists the new archives, the release lacks them, so a
#      workflow_dispatch run for that version uploads them and checks the rest.
#
# The rebuild only matches when the toolchain matches the one that built the
# published archive. remove-background is a Swift binary, so it builds on the
# Xcode the release was made with (Xcode 27.0, 27A266a); boost reproduces on
# macos-14. The package job prints the toolchain so a mismatch can be traced.
#
# Only the publish job can write to the repository. The package job runs
# `npm ci` — every dev dependency's install scripts — with a read-only token.
# Actions are pinned to commit SHAs; the comment names the release.
#
# Windows and Linux archives are assembled on the macOS runner (they are only
# files, and package-extension.mjs packs the same bytes on any host) and then
# run for real on windows-latest and ubuntu-latest by the verify-windows and
# verify-linux jobs, also with read-only tokens. Nothing is uploaded until
# both have passed: resolve -> package -> verify-windows, verify-linux -> publish.
#
# remove-background is Apple Vision's Swift helper, macOS only. Its ONNX
# runner (extensions/remove-background-onnx) is not built here until a model
# passes the quality bar. Boost's Linux x64 payload is built here (WebGPU, through
# Vulkan); there is none for Linux arm64, whose ONNX Runtime has no WebGPU.
#
# whisper packages on macos-26 (publish.yml's runner; the Mac archive was
# built on Xcode 27, so a different Xcode there may not match it byte for
# byte, which the check below would say). Its Mac archive is built here from source (one
# universal whisper-cli), its Windows ones are upstream's own whisper.cpp
# binaries (pinned by sha256), and its Linux ones are cross-built with a
# hash-pinned zig, which makes the same bytes on any host. Every archive
# carries the same speech model, model.bin (ggml-base q5_1, 60 MB).

on:
  push:
    tags:
      - 'ext-boost-v*'
      - 'ext-remove-background-v*'
      - 'ext-heic-v*'
      - 'ext-raw-v*'
      - 'ext-video-v*'
      - 'ext-whisper-v*'
      - 'ext-read-text-v*'
  workflow_dispatch:
    inputs:
      id:
        description: 'Extension id'
        required: true
        type: choice
        options: [boost, remove-background, heic, raw, video, whisper, read-text]
      version:
        description: 'Version (no leading v); a release ext-<id>-v<version> must exist or will be created'
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.ref.outputs.id }}
      version: ${{ steps.ref.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
      runner: ${{ steps.ref.outputs.runner }}
    steps:
      - name: Resolve id, version, tag and runner
        id: ref
        shell: bash
        # Inputs reach the script as environment variables, never pasted into it.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ID: ${{ inputs.id }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            id="$INPUT_ID"; version="$INPUT_VERSION"
          else
            tag="$GITHUB_REF_NAME"
            rest="${tag#ext-}"
            id="${rest%-v*}"; version="${rest##*-v}"
          fi
          case "$id" in
            boost) runner=macos-14 ;;
            remove-background) runner=xcode-27 ;;
            # Pure JavaScript and WebAssembly, packaged for Windows and Linux; any macOS runner assembles it.
            heic) runner=macos-14 ;;
            # LibRaw through libraw-wasm: JavaScript and WebAssembly too, packaged the same way as heic.
            raw) runner=macos-14 ;;
            # PP-OCR on ONNX Runtime: JavaScript and prebuilt libraries for every OS; any macOS runner assembles it.
            read-text) runner=macos-14 ;;
            # ffmpeg, compiled from source for Apple Silicon (extensions/video/build.sh).
            video) runner=macos-14 ;;
            # whisper.cpp's whisper-cli: Mac built, Windows repacked, Linux cross-built with zig (extensions/whisper/build.mjs).
            whisper) runner=macos-26 ;;
            *) echo "::error::unknown extension id: $id"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got: $version"; exit 1
          fi
          {
            echo "id=$id"
            echo "version=$version"
            echo "tag=ext-$id-v$version"
            echo "runner=$runner"
          } >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 20 is what the boost rebuild has been verified to reproduce on.
      # Moving it is a change to the build to verify, not a free upgrade.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Toolchain
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            sw_vers
            xcodebuild -version
            swiftc --version
          else
            uname -a
            cmake --version | head -1
          fi
          node --version

      # zig from PyPI, pinned by hash; it is what makes the Linux builds reproducible.
      - name: Build tools (whisper)
        if: needs.resolve.outputs.id == 'whisper'
        run: |
          # A venv: the macOS runner's Python is Homebrew's, which refuses a bare pip install (PEP 668).
          python3 -m venv .zig
          .zig/bin/python -m pip install --require-hashes -r extensions/whisper/zig-requirements.txt
          .zig/bin/python -m ziglang version
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja

      # ffmpeg's build tools; only the video extension compiles C.
      - name: Build tools (video)
        if: needs.resolve.outputs.id == 'video'
        run: brew install nasm pkg-config autoconf automake libtool

      - name: Build and package
        shell: bash
        env:
          ID: ${{ needs.resolve.outputs.id }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mkdir -p dist-ext/out
          : > dist-ext/assets.jsonl
          if [ "$ID" = "boost" ]; then
            for arch in arm64 x64; do
              node extensions/boost/build.mjs --arch "$arch" --out "dist-ext/payload-$arch"
              node scripts/package-extension.mjs boost "$VERSION" "$arch" "dist-ext/payload-$arch" dist-ext/out >> dist-ext/assets.jsonl
            done
            # Windows reuses the model the arm64 build converted (verified against the same
            # pinned sha256), so nothing is converted twice and no Python is needed for it.
            for arch in x64 arm64; do
              node extensions/boost/build.mjs --platform win32 --arch "$arch" --onnx dist-ext/payload-arm64/realesr-general-x4v3.onnx --out "dist-ext/payload-win32-$arch"
              node scripts/package-extension.mjs boost "$VERSION" "win32-$arch" "dist-ext/payload-win32-$arch" dist-ext/out >> dist-ext/assets.jsonl
            done
            # Linux x64 only: WebGPU is in its ONNX Runtime, not Linux arm64's.
            node extensions/boost/build.mjs --platform linux --arch x64 --onnx dist-ext/payload-arm64/realesr-general-x4v3.onnx --out dist-ext/payload-linux-x64
            node scripts/package-extension.mjs boost "$VERSION" linux-x64 dist-ext/payload-linux-x64 dist-ext/out >> dist-ext/assets.jsonl
          elif [ "$ID" = "video" ]; then
            # The GPL asks for the source beside the binaries: the source bundle goes
            # into out/ too, so publish uploads it to the same release.
            sh extensions/video/build.sh dist-ext/payload-arm64 dist-ext/out
            node scripts/package-extension.mjs video "$VERSION" arm64 dist-ext/payload-arm64 dist-ext/out >> dist-ext/assets.jsonl
          elif [ "$ID" = "whisper" ]; then
            node extensions/whisper/build.mjs --platform darwin --arch universal --out dist-ext/payload-universal
            node scripts/package-extension.mjs whisper "$VERSION" universal dist-ext/payload-universal dist-ext/out >> dist-ext/assets.jsonl
            for arch in x64 arm64; do
              node extensions/whisper/build.mjs --platform win32 --arch "$arch" --out "dist-ext/payload-win32-$arch"
              node scripts/package-extension.mjs whisper "$VERSION" "win32-$arch" "dist-ext/payload-win32-$arch" dist-ext/out >> dist-ext/assets.jsonl
              node extensions/whisper/build.mjs --platform linux --arch "$arch" --zig "$PWD/.zig/bin/python -m ziglang" --out "dist-ext/payload-linux-$arch"
              node scripts/package-extension.mjs whisper "$VERSION" "linux-$arch" "dist-ext/payload-linux-$arch" dist-ext/out >> dist-ext/assets.jsonl
            done
          elif [ "$ID" = "read-text" ]; then
            # Mac builds are labelled by chip alone, as published before Windows; the others say their OS.
            for spec in darwin:arm64:arm64 darwin:x64:x64 win32:x64:win32-x64 win32:arm64:win32-arm64 linux:x64:linux-x64 linux:arm64:linux-arm64; do
              IFS=: read -r os arch label <<< "$spec"
              node extensions/read-text/build.mjs --platform "$os" --arch "$arch" --out "dist-ext/payload-$label"
              node scripts/package-extension.mjs read-text "$VERSION" "$label" "dist-ext/payload-$label" dist-ext/out >> dist-ext/assets.jsonl
            done
          elif [ "$ID" = "heic" ] || [ "$ID" = "raw" ]; then
            # The same files for both; only the manifest's arch differs.
            for platform in win32 linux; do
              node "extensions/$ID/build.mjs" --out "dist-ext/payload-$platform-universal"
              node scripts/package-extension.mjs "$ID" "$VERSION" "$platform-universal" "dist-ext/payload-$platform-universal" dist-ext/out >> dist-ext/assets.jsonl
            done
          else
            bash extensions/remove-background/build.sh dist-ext/payload-universal
            node scripts/package-extension.mjs remove-background "$VERSION" universal dist-ext/payload-universal dist-ext/out >> dist-ext/assets.jsonl
          fi
          cat dist-ext/assets.jsonl

      - name: Verify against the catalogue
        shell: bash
        env:
          ID: ${{ needs.resolve.outputs.id }}
        run: |
          # Prints the catalogued sha256 for an asset file name, or nothing if it is not catalogued.
          catalogued() {
            node -e '
              const src = require("fs").readFileSync("src/extensions/catalog.ts", "utf8")
              const at = src.indexOf("/" + process.argv[1] + "`")
              if (at >= 0) process.stdout.write(/sha256: \x27([0-9a-f]{64})\x27/.exec(src.slice(at))[1])
            ' "$1"
          }
          # shasum on macOS, sha256sum where that is missing (Linux, Git Bash).
          sha256_of() {
            if command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1"; else sha256sum "$1"; fi | cut -d' ' -f1
          }
          : > dist-ext/catalogued.txt
          status=0
          for f in dist-ext/out/*.tar.gz; do
            name="$(basename "$f")"
            want="$(catalogued "$name")"
            got="$(sha256_of "$f")"
            if [ -z "$want" ]; then
              echo "$name: not in the catalogue (built, not offered)"
            elif [ "$want" = "$got" ]; then
              echo "$name: matches the catalogue"
              echo "$name" >> dist-ext/catalogued.txt
            elif [ "$ID" = "whisper" ] && [ "${name%-universal.tar.gz}" != "$name" ]; then
              # The Mac whisper-cli is compiled by the runner's Xcode, which need not be the one
              # that built the published file; the published file stands, and is what installs.
              # Not listed as catalogued, so publish keeps the release's own copy without comparing.
              echo "::warning::$name: rebuilt on $(xcodebuild -version | head -1), sha256 $got, not the catalogue's $want (built on another Xcode)"
            else
              echo "::error::$name: rebuilt sha256 $got differs from the catalogue's $want"
              status=1
            fi
          done
          exit $status

      # The Mac build, run on this runner with the model it carries: a real
      # transcription of whisper.cpp's own sample.
      - name: whisper runs on macOS
        if: needs.resolve.outputs.id == 'whisper'
        shell: bash
        run: |
          dist-ext/payload-universal/whisper-cli -m dist-ext/payload-universal/model.bin -f extensions/whisper/.cache/whisper.cpp-*/samples/jfk.wav -l en -nt > out.txt
          cat out.txt
          grep -qi "ask not what your country" out.txt

      # What publish uploads: the archives, which of them the catalogue lists,
      # and the values for the catalogue entry.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-ext
          path: |
            dist-ext/out/*.tar.gz
            dist-ext/catalogued.txt
            dist-ext/assets.jsonl
          if-no-files-found: error

      # Keep the payload directories so verify-windows and verify-linux run the very files that were packaged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payloads
          path: dist-ext/payload-*
          if-no-files-found: error

  # Runs what the Windows archives contain, on Windows. Nothing here publishes anything.
  verify-windows:
    needs: [resolve, package]
    if: >-
      needs.resolve.outputs.id == 'boost' || needs.resolve.outputs.id == 'heic' ||
      needs.resolve.outputs.id == 'raw' || needs.resolve.outputs.id == 'read-text' ||
      needs.resolve.outputs.id == 'whisper'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payloads
          path: dist-ext

      - name: Boost runs on Windows
        if: needs.resolve.outputs.id == 'boost'
        run: |
          # No PNG is checked in for this, so write a 32x32 gradient with node's zlib alone.
          node -e '
            const zlib = require("zlib"), fs = require("fs")
            const crcTable = Array.from({ length: 256 }, (_, n) => {
              let c = n
              for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1
              return c >>> 0
            })
            const crc = (b) => {
              let c = 0xffffffff
              for (const x of b) c = crcTable[(c ^ x) & 255] ^ (c >>> 8)
              return (c ^ 0xffffffff) >>> 0
            }
            const chunk = (type, data) => {
              const body = Buffer.concat([Buffer.from(type), data])
              const len = Buffer.alloc(4); len.writeUInt32BE(data.length)
              const sum = Buffer.alloc(4); sum.writeUInt32BE(crc(body))
              return Buffer.concat([len, body, sum])
            }
            const W = 32, H = 32
            const ihdr = Buffer.alloc(13)
            ihdr.writeUInt32BE(W, 0); ihdr.writeUInt32BE(H, 4); ihdr[8] = 8; ihdr[9] = 2
            const raw = Buffer.alloc((W * 3 + 1) * H)
            for (let y = 0; y < H; y++)
              for (let x = 0; x < W; x++) {
                const i = y * (W * 3 + 1) + 1 + x * 3
                raw[i] = x * 8; raw[i + 1] = y * 8; raw[i + 2] = 128
              }
            fs.writeFileSync("in.png", Buffer.concat([
              Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]),
              chunk("IHDR", ihdr), chunk("IDAT", zlib.deflateSync(raw)), chunk("IEND", Buffer.alloc(0)),
            ]))
          '
          # runner.mjs --in <png> --out <png> --scale 1|2|3|4
          node dist-ext/payload-win32-x64/runner.mjs --in in.png --out out.png --scale 2
          test -s out.png
          node -e '
            const b = require("fs").readFileSync("out.png")
            const w = b.readUInt32BE(16), h = b.readUInt32BE(20)
            if (w !== 64 || h !== 64) { console.error("expected 64x64, got " + w + "x" + h); process.exit(1) }
          '

      # A blank page: ONNX Runtime and both models load and run, and the reply is the read contract.
      - name: read-text runs on Windows
        if: needs.resolve.outputs.id == 'read-text'
        run: |
          node -e '
            const zlib = require("zlib"), fs = require("fs")
            const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0 })
            const crc = (b) => { let c = 0xffffffff; for (const x of b) c = crcTable[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0 }
            const chunk = (t, d) => { const body = Buffer.concat([Buffer.from(t), d]); const l = Buffer.alloc(4); l.writeUInt32BE(d.length); const s = Buffer.alloc(4); s.writeUInt32BE(crc(body)); return Buffer.concat([l, body, s]) }
            const W = 64, H = 64, ihdr = Buffer.alloc(13); ihdr.writeUInt32BE(W, 0); ihdr.writeUInt32BE(H, 4); ihdr[8] = 8; ihdr[9] = 2
            const raw = Buffer.alloc((W * 3 + 1) * H, 255); for (let y = 0; y < H; y++) raw[y * (W * 3 + 1)] = 0
            fs.writeFileSync("blank.png", Buffer.concat([Buffer.from([137,80,78,71,13,10,26,10]), chunk("IHDR", ihdr), chunk("IDAT", zlib.deflateSync(raw)), chunk("IEND", Buffer.alloc(0))]))
          '
          out="$(node dist-ext/payload-win32-x64/runner.mjs --in blank.png | tail -1)"
          echo "$out"
          printf '%s' "$out" | grep -q '"ok":true'

      - name: HEIC extension runs on Windows
        if: needs.resolve.outputs.id == 'heic'
        run: |
          out="$(node dist-ext/payload-win32-universal/runner.mjs --info --in tests/fixtures/heic/small.heic)"
          echo "$out"
          printf '%s' "$out" | grep -Eq '"width"[[:space:]]*:[[:space:]]*64([^0-9]|$)'
          # And a real decode: raw RGBA, exactly 64 x 48 x 4 bytes.
          node dist-ext/payload-win32-universal/runner.mjs --in tests/fixtures/heic/small.heic --out x.rgba
          node -e '
            const n = require("fs").statSync("x.rgba").size
            if (n !== 64 * 48 * 4) { console.error("expected " + 64 * 48 * 4 + " bytes, got " + n); process.exit(1) }
          '

      # The fixture is a 64x48 DNG turned a quarter (orientation 6) with a 60x44 maker's
      # crop (tests/fixtures/README.md): a right decode is cropped, then upright, 44x60.
      - name: RAW extension runs on Windows
        if: needs.resolve.outputs.id == 'raw'
        run: |
          out="$(node dist-ext/payload-win32-universal/runner.mjs --info --in tests/fixtures/raw/small.dng)"
          echo "$out"
          printf '%s' "$out" | grep -Eq '"width"[[:space:]]*:[[:space:]]*44([^0-9]|$)'
          printf '%s' "$out" | grep -Eq '"height"[[:space:]]*:[[:space:]]*60([^0-9]|$)'
          # And a real decode: raw RGB, exactly 44 x 60 x 3 bytes.
          node dist-ext/payload-win32-universal/runner.mjs --in tests/fixtures/raw/small.dng --out x.rgb
          node -e '
            const n = require("fs").statSync("x.rgb").size
            if (n !== 44 * 60 * 3) { console.error("expected " + 44 * 60 * 3 + " bytes, got " + n); process.exit(1) }
          '

      # x64 only, as for boost: windows-latest cannot run the arm64 build.
      - name: whisper runs on Windows
        if: needs.resolve.outputs.id == 'whisper'
        run: |
          curl -fsSL -o jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.5/samples/jfk.wav
          dist-ext/payload-win32-x64/whisper-cli.exe -m dist-ext/payload-win32-x64/model.bin -f jfk.wav -l en -nt > out.txt
          cat out.txt
          grep -qi "ask not what your country" out.txt

  # Runs what the Linux archives contain, on Linux (x64; the arm64 archives are
  # the same build for the other chip). Nothing here publishes anything.
  verify-linux:
    needs: [resolve, package]
    if: >-
      needs.resolve.outputs.id == 'heic' || needs.resolve.outputs.id == 'raw' ||
      needs.resolve.outputs.id == 'whisper' || needs.resolve.outputs.id == 'read-text' ||
      needs.resolve.outputs.id == 'boost'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payloads
          path: dist-ext

      # A runner without a graphics card: WebGPU may not start, and the processor takes the one tile.
      - name: Boost runs on Linux
        if: needs.resolve.outputs.id == 'boost'
        run: |
          # No PNG is checked in for this, so write a 32x32 gradient with node's zlib alone.
          node -e '
            const zlib = require("zlib"), fs = require("fs")
            const crcTable = Array.from({ length: 256 }, (_, n) => {
              let c = n
              for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1
              return c >>> 0
            })
            const crc = (b) => {
              let c = 0xffffffff
              for (const x of b) c = crcTable[(c ^ x) & 255] ^ (c >>> 8)
              return (c ^ 0xffffffff) >>> 0
            }
            const chunk = (type, data) => {
              const body = Buffer.concat([Buffer.from(type), data])
              const len = Buffer.alloc(4); len.writeUInt32BE(data.length)
              const sum = Buffer.alloc(4); sum.writeUInt32BE(crc(body))
              return Buffer.concat([len, body, sum])
            }
            const W = 32, H = 32
            const ihdr = Buffer.alloc(13)
            ihdr.writeUInt32BE(W, 0); ihdr.writeUInt32BE(H, 4); ihdr[8] = 8; ihdr[9] = 2
            const raw = Buffer.alloc((W * 3 + 1) * H)
            for (let y = 0; y < H; y++)
              for (let x = 0; x < W; x++) {
                const i = y * (W * 3 + 1) + 1 + x * 3
                raw[i] = x * 8; raw[i + 1] = y * 8; raw[i + 2] = 128
              }
            fs.writeFileSync("in.png", Buffer.concat([
              Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]),
              chunk("IHDR", ihdr), chunk("IDAT", zlib.deflateSync(raw)), chunk("IEND", Buffer.alloc(0)),
            ]))
          '
          # runner.mjs --in <png> --out <png> --scale 1|2|3|4
          node dist-ext/payload-linux-x64/runner.mjs --in in.png --out out.png --scale 2
          test -s out.png
          node -e '
            const b = require("fs").readFileSync("out.png")
            const w = b.readUInt32BE(16), h = b.readUInt32BE(20)
            if (w !== 64 || h !== 64) { console.error("expected 64x64, got " + w + "x" + h); process.exit(1) }
          '

      # A blank page: ONNX Runtime and both models load and run, and the reply is the read contract.
      - name: read-text runs on Linux
        if: needs.resolve.outputs.id == 'read-text'
        run: |
          node -e '
            const zlib = require("zlib"), fs = require("fs")
            const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0 })
            const crc = (b) => { let c = 0xffffffff; for (const x of b) c = crcTable[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0 }
            const chunk = (t, d) => { const body = Buffer.concat([Buffer.from(t), d]); const l = Buffer.alloc(4); l.writeUInt32BE(d.length); const s = Buffer.alloc(4); s.writeUInt32BE(crc(body)); return Buffer.concat([l, body, s]) }
            const W = 64, H = 64, ihdr = Buffer.alloc(13); ihdr.writeUInt32BE(W, 0); ihdr.writeUInt32BE(H, 4); ihdr[8] = 8; ihdr[9] = 2
            const raw = Buffer.alloc((W * 3 + 1) * H, 255); for (let y = 0; y < H; y++) raw[y * (W * 3 + 1)] = 0
            fs.writeFileSync("blank.png", Buffer.concat([Buffer.from([137,80,78,71,13,10,26,10]), chunk("IHDR", ihdr), chunk("IDAT", zlib.deflateSync(raw)), chunk("IEND", Buffer.alloc(0))]))
          '
          out="$(node dist-ext/payload-linux-x64/runner.mjs --in blank.png | tail -1)"
          echo "$out"
          printf '%s' "$out" | grep -q '"ok":true'

      - name: HEIC extension runs on Linux
        if: needs.resolve.outputs.id == 'heic'
        run: |
          out="$(node dist-ext/payload-linux-universal/runner.mjs --info --in tests/fixtures/heic/small.heic)"
          echo "$out"
          printf '%s' "$out" | grep -Eq '"width"[[:space:]]*:[[:space:]]*64([^0-9]|$)'
          # And a real decode: raw RGBA, exactly 64 x 48 x 4 bytes.
          node dist-ext/payload-linux-universal/runner.mjs --in tests/fixtures/heic/small.heic --out x.rgba
          node -e '
            const n = require("fs").statSync("x.rgba").size
            if (n !== 64 * 48 * 4) { console.error("expected " + 64 * 48 * 4 + " bytes, got " + n); process.exit(1) }
          '
      # The same fixture as on Windows: cropped, then upright, 44x60.
      - name: RAW extension runs on Linux
        if: needs.resolve.outputs.id == 'raw'
        run: |
          out="$(node dist-ext/payload-linux-universal/runner.mjs --info --in tests/fixtures/raw/small.dng)"
          echo "$out"
          printf '%s' "$out" | grep -Eq '"width"[[:space:]]*:[[:space:]]*44([^0-9]|$)'
          printf '%s' "$out" | grep -Eq '"height"[[:space:]]*:[[:space:]]*60([^0-9]|$)'
          # And a real decode: raw RGB, exactly 44 x 60 x 3 bytes.
          node dist-ext/payload-linux-universal/runner.mjs --in tests/fixtures/raw/small.dng --out x.rgb
          node -e '
            const n = require("fs").statSync("x.rgb").size
            if (n !== 44 * 60 * 3) { console.error("expected " + 44 * 60 * 3 + " bytes, got " + n); process.exit(1) }
          '
      # A real transcription of whisper.cpp's own sample, with the model the archive carries.
      - name: whisper runs on Linux
        if: needs.resolve.outputs.id == 'whisper'
        run: |
          curl -fsSL -o jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.5/samples/jfk.wav
          chmod +x dist-ext/payload-linux-x64/whisper-cli
          dist-ext/payload-linux-x64/whisper-cli -m dist-ext/payload-linux-x64/model.bin -f jfk.wav -l en -nt > out.txt
          cat out.txt
          grep -qi "ask not what your country" out.txt

  # Uploads only after the Windows and Linux archives have run there. An id with
  # none for an OS skips that job, and a skip counts as passed.
  publish:
    needs: [resolve, package, verify-windows, verify-linux]
    if: >-
      always() && needs.resolve.result == 'success' && needs.package.result == 'success' &&
      (needs.verify-windows.result == 'success' || needs.verify-windows.result == 'skipped') &&
      (needs.verify-linux.result == 'success' || needs.verify-linux.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-ext
          path: dist-ext

      - name: Upload what the release lacks, verify what it has
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Forge extension payload $TAG"
          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          mkdir -p dist-ext/published
          for f in dist-ext/out/*.tar.gz; do
            name="$(basename "$f")"
            if printf '%s\n' "$have" | grep -Fxq "$name"; then
              # Already published: never replaced. A catalogued one must match its sha256.
              gh release download "$TAG" --pattern "$name" --dir dist-ext/published
              if grep -Fxq "$name" dist-ext/catalogued.txt; then
                cmp "$f" "dist-ext/published/$name" || { echo "::error::$name on the release differs from the catalogue"; exit 1; }
              fi
              echo "$name: already on the release, left as is"
            else
              gh release upload "$TAG" "$f"
            fi
          done

      - name: Summary for the catalogue entry
        shell: bash
        run: |
          {
            echo "### $TAG"
            echo
            echo "Update the catalogue entry with these values:"
            echo
            echo '```json'
            cat dist-ext/assets.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
