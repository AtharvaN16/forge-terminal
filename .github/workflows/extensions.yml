name: extensions

# Release process (the catalogue in src/extensions/catalog.ts is the truth):
#
#   1. The archives the catalogue's sha256 values describe are kept in
#      ~/Developer/forge-release-assets/ext-v1.0.0/. Publish exactly those:
#        gh release create ext-<id>-v<version> <those .tar.gz files>
#   2. This workflow then rebuilds from source as a check. It never replaces
#      a published asset (no --clobber, ever): a rebuilt archive whose sha256
#      differs from the catalogue fails the job, and an asset already on the
#      release is downloaded and verified against the catalogue instead of
#      overwritten. Only an archive the catalogue does not list (boost x64,
#      built but not offered) and the release does not have is uploaded.
#
# The rebuild only matches when the toolchain matches the one that built the
# published archive. remove-background is a Swift binary, so it builds on the
# Xcode the release was made with (Xcode 27.0, 27A266a); boost reproduces on
# macos-14. The package job prints the toolchain so a mismatch can be traced.
#
# Only the publish job can write to the repository. The package job runs
# `npm ci` — every dev dependency's install scripts — with a read-only token.
# Actions are pinned to commit SHAs; the comment names the release.
#
# Windows archives are assembled on the macOS runner (they are only files) and
# then run for real on windows-latest by the verify-windows job, also with a
# read-only token. Nothing is uploaded until that has passed:
# resolve -> package -> verify-windows -> publish.
#
# whisper packages on ubuntu-latest: its Windows archives are upstream's own
# whisper.cpp binaries (pinned by sha256), and its Linux ones are cross-built
# with a hash-pinned zig, which makes the same bytes on any host.

on:
  push:
    tags:
      - 'ext-boost-v*'
      - 'ext-remove-background-v*'
      - 'ext-heic-v*'
      - 'ext-video-v*'
      - 'ext-whisper-v*'
  workflow_dispatch:
    inputs:
      id:
        description: 'Extension id'
        required: true
        type: choice
        options: [boost, remove-background, heic, video, whisper]
      version:
        description: 'Version (no leading v); a release ext-<id>-v<version> must exist or will be created'
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.ref.outputs.id }}
      version: ${{ steps.ref.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
      runner: ${{ steps.ref.outputs.runner }}
    steps:
      - name: Resolve id, version, tag and runner
        id: ref
        shell: bash
        # Inputs reach the script as environment variables, never pasted into it.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ID: ${{ inputs.id }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            id="$INPUT_ID"; version="$INPUT_VERSION"
          else
            tag="$GITHUB_REF_NAME"
            rest="${tag#ext-}"
            id="${rest%-v*}"; version="${rest##*-v}"
          fi
          case "$id" in
            boost) runner=macos-14 ;;
            remove-background) runner=xcode-27 ;;
            # Pure JavaScript and WebAssembly, packaged for Windows; any macOS runner assembles it.
            heic) runner=macos-14 ;;
            # ffmpeg, compiled from source for Apple Silicon (extensions/video/build.sh).
            video) runner=macos-14 ;;
            # whisper.cpp's whisper-cli: Windows repacked, Linux cross-built with zig (extensions/whisper/build.mjs).
            whisper) runner=ubuntu-latest ;;
            *) echo "::error::unknown extension id: $id"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got: $version"; exit 1
          fi
          {
            echo "id=$id"
            echo "version=$version"
            echo "tag=ext-$id-v$version"
            echo "runner=$runner"
          } >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 20 is what the boost rebuild has been verified to reproduce on.
      # Moving it is a change to the build to verify, not a free upgrade.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Toolchain
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            sw_vers
            xcodebuild -version
            swiftc --version
          else
            uname -a
            cmake --version | head -1
          fi
          node --version

      # zig from PyPI, pinned by hash; it is what makes the Linux builds reproducible.
      - name: Build tools (whisper)
        if: needs.resolve.outputs.id == 'whisper'
        run: |
          python3 -m pip install --require-hashes -r extensions/whisper/zig-requirements.txt
          python3 -m ziglang version
          command -v ninja || sudo apt-get install -y ninja-build

      # ffmpeg's build tools; only the video extension compiles C.
      - name: Build tools (video)
        if: needs.resolve.outputs.id == 'video'
        run: brew install nasm pkg-config autoconf automake libtool

      - name: Build and package
        shell: bash
        env:
          ID: ${{ needs.resolve.outputs.id }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mkdir -p dist-ext/out
          : > dist-ext/assets.jsonl
          if [ "$ID" = "boost" ]; then
            for arch in arm64 x64; do
              node extensions/boost/build.mjs --arch "$arch" --out "dist-ext/payload-$arch"
              node scripts/package-extension.mjs boost "$VERSION" "$arch" "dist-ext/payload-$arch" dist-ext/out >> dist-ext/assets.jsonl
            done
            # Windows reuses the model the arm64 build converted (verified against the same
            # pinned sha256), so nothing is converted twice and no Python is needed for it.
            for arch in x64 arm64; do
              node extensions/boost/build.mjs --platform win32 --arch "$arch" --onnx dist-ext/payload-arm64/realesr-general-x4v3.onnx --out "dist-ext/payload-win32-$arch"
              node scripts/package-extension.mjs boost "$VERSION" "win32-$arch" "dist-ext/payload-win32-$arch" dist-ext/out >> dist-ext/assets.jsonl
            done
          elif [ "$ID" = "video" ]; then
            # The GPL asks for the source beside the binaries: the source bundle goes
            # into out/ too, so publish uploads it to the same release.
            sh extensions/video/build.sh dist-ext/payload-arm64 dist-ext/out
            node scripts/package-extension.mjs video "$VERSION" arm64 dist-ext/payload-arm64 dist-ext/out >> dist-ext/assets.jsonl
          elif [ "$ID" = "whisper" ]; then
            for arch in x64 arm64; do
              node extensions/whisper/build.mjs --platform win32 --arch "$arch" --out "dist-ext/payload-win32-$arch"
              node scripts/package-extension.mjs whisper "$VERSION" "win32-$arch" "dist-ext/payload-win32-$arch" dist-ext/out >> dist-ext/assets.jsonl
              node extensions/whisper/build.mjs --platform linux --arch "$arch" --zig "python3 -m ziglang" --out "dist-ext/payload-linux-$arch"
              node scripts/package-extension.mjs whisper "$VERSION" "linux-$arch" "dist-ext/payload-linux-$arch" dist-ext/out >> dist-ext/assets.jsonl
            done
          elif [ "$ID" = "heic" ]; then
            node extensions/heic/build.mjs --out dist-ext/payload-win32-universal
            node scripts/package-extension.mjs heic "$VERSION" win32-universal dist-ext/payload-win32-universal dist-ext/out >> dist-ext/assets.jsonl
          else
            bash extensions/remove-background/build.sh dist-ext/payload-universal
            node scripts/package-extension.mjs remove-background "$VERSION" universal dist-ext/payload-universal dist-ext/out >> dist-ext/assets.jsonl
          fi
          cat dist-ext/assets.jsonl

      - name: Verify against the catalogue
        shell: bash
        run: |
          # Prints the catalogued sha256 for an asset file name, or nothing if it is not catalogued.
          catalogued() {
            node -e '
              const src = require("fs").readFileSync("src/extensions/catalog.ts", "utf8")
              const at = src.indexOf("/" + process.argv[1] + "`")
              if (at >= 0) process.stdout.write(/sha256: \x27([0-9a-f]{64})\x27/.exec(src.slice(at))[1])
            ' "$1"
          }
          # shasum on macOS, sha256sum where that is missing (Linux, Git Bash).
          sha256_of() {
            if command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1"; else sha256sum "$1"; fi | cut -d' ' -f1
          }
          : > dist-ext/catalogued.txt
          status=0
          for f in dist-ext/out/*.tar.gz; do
            name="$(basename "$f")"
            want="$(catalogued "$name")"
            got="$(sha256_of "$f")"
            if [ -z "$want" ]; then
              echo "$name: not in the catalogue (built, not offered)"
            elif [ "$want" = "$got" ]; then
              echo "$name: matches the catalogue"
              echo "$name" >> dist-ext/catalogued.txt
            else
              echo "::error::$name: rebuilt sha256 $got differs from the catalogue's $want"
              status=1
            fi
          done
          exit $status

      # The x64 Linux build, run on this (x64) runner: a real transcription of
      # whisper.cpp's own sample with its smallest model, pinned by sha256.
      - name: whisper runs on Linux
        if: needs.resolve.outputs.id == 'whisper'
        shell: bash
        run: |
          curl -fsSL -o ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" | sha256sum -c -
          dist-ext/payload-linux-x64/whisper-cli -m ggml-tiny.bin -f extensions/whisper/.cache/whisper.cpp-*/samples/jfk.wav -l en -nt > out.txt
          cat out.txt
          grep -qi "ask not what your country" out.txt

      # What publish uploads: the archives, which of them the catalogue lists,
      # and the values for the catalogue entry.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-ext
          path: |
            dist-ext/out/*.tar.gz
            dist-ext/catalogued.txt
            dist-ext/assets.jsonl
          if-no-files-found: error

      # Keep the payload directories so verify-windows runs the very files that were packaged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payloads
          path: dist-ext/payload-*
          if-no-files-found: error

  # Runs what the Windows archives contain, on Windows. Nothing here publishes anything.
  verify-windows:
    needs: [resolve, package]
    if: >-
      needs.resolve.outputs.id == 'boost' || needs.resolve.outputs.id == 'heic' ||
      needs.resolve.outputs.id == 'whisper'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payloads
          path: dist-ext

      - name: Boost runs on Windows
        if: needs.resolve.outputs.id == 'boost'
        run: |
          # No PNG is checked in for this, so write a 32x32 gradient with node's zlib alone.
          node -e '
            const zlib = require("zlib"), fs = require("fs")
            const crcTable = Array.from({ length: 256 }, (_, n) => {
              let c = n
              for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1
              return c >>> 0
            })
            const crc = (b) => {
              let c = 0xffffffff
              for (const x of b) c = crcTable[(c ^ x) & 255] ^ (c >>> 8)
              return (c ^ 0xffffffff) >>> 0
            }
            const chunk = (type, data) => {
              const body = Buffer.concat([Buffer.from(type), data])
              const len = Buffer.alloc(4); len.writeUInt32BE(data.length)
              const sum = Buffer.alloc(4); sum.writeUInt32BE(crc(body))
              return Buffer.concat([len, body, sum])
            }
            const W = 32, H = 32
            const ihdr = Buffer.alloc(13)
            ihdr.writeUInt32BE(W, 0); ihdr.writeUInt32BE(H, 4); ihdr[8] = 8; ihdr[9] = 2
            const raw = Buffer.alloc((W * 3 + 1) * H)
            for (let y = 0; y < H; y++)
              for (let x = 0; x < W; x++) {
                const i = y * (W * 3 + 1) + 1 + x * 3
                raw[i] = x * 8; raw[i + 1] = y * 8; raw[i + 2] = 128
              }
            fs.writeFileSync("in.png", Buffer.concat([
              Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]),
              chunk("IHDR", ihdr), chunk("IDAT", zlib.deflateSync(raw)), chunk("IEND", Buffer.alloc(0)),
            ]))
          '
          # runner.mjs --in <png> --out <png> --scale 1|2|3|4
          node dist-ext/payload-win32-x64/runner.mjs --in in.png --out out.png --scale 2
          test -s out.png
          node -e '
            const b = require("fs").readFileSync("out.png")
            const w = b.readUInt32BE(16), h = b.readUInt32BE(20)
            if (w !== 64 || h !== 64) { console.error("expected 64x64, got " + w + "x" + h); process.exit(1) }
          '

      - name: HEIC extension runs on Windows
        if: needs.resolve.outputs.id == 'heic'
        run: |
          out="$(node dist-ext/payload-win32-universal/runner.mjs --info --in tests/fixtures/heic/small.heic)"
          echo "$out"
          printf '%s' "$out" | grep -Eq '"width"[[:space:]]*:[[:space:]]*64([^0-9]|$)'
          # And a real decode: raw RGBA, exactly 64 x 48 x 4 bytes.
          node dist-ext/payload-win32-universal/runner.mjs --in tests/fixtures/heic/small.heic --out x.rgba
          node -e '
            const n = require("fs").statSync("x.rgba").size
            if (n !== 64 * 48 * 4) { console.error("expected " + 64 * 48 * 4 + " bytes, got " + n); process.exit(1) }
          '

      # x64 only, as for boost: windows-latest cannot run the arm64 build.
      - name: whisper runs on Windows
        if: needs.resolve.outputs.id == 'whisper'
        run: |
          curl -fsSL -o ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" | sha256sum -c -
          curl -fsSL -o jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.5/samples/jfk.wav
          dist-ext/payload-win32-x64/whisper-cli.exe -m ggml-tiny.bin -f jfk.wav -l en -nt > out.txt
          cat out.txt
          grep -qi "ask not what your country" out.txt

  # Uploads only after the Windows archives have run on Windows. remove-background
  # has none, so for it verify-windows is skipped and that counts as passed.
  publish:
    needs: [resolve, package, verify-windows]
    if: >-
      always() && needs.resolve.result == 'success' && needs.package.result == 'success' &&
      (needs.verify-windows.result == 'success' || needs.verify-windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-ext
          path: dist-ext

      - name: Upload what the release lacks, verify what it has
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Forge extension payload $TAG"
          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          mkdir -p dist-ext/published
          for f in dist-ext/out/*.tar.gz; do
            name="$(basename "$f")"
            if printf '%s\n' "$have" | grep -Fxq "$name"; then
              # Already published: never replaced. A catalogued one must match its sha256.
              gh release download "$TAG" --pattern "$name" --dir dist-ext/published
              if grep -Fxq "$name" dist-ext/catalogued.txt; then
                cmp "$f" "dist-ext/published/$name" || { echo "::error::$name on the release differs from the catalogue"; exit 1; }
              fi
              echo "$name: already on the release, left as is"
            else
              gh release upload "$TAG" "$f"
            fi
          done

      - name: Summary for the catalogue entry
        shell: bash
        run: |
          {
            echo "### $TAG"
            echo
            echo "Update the catalogue entry with these values:"
            echo
            echo '```json'
            cat dist-ext/assets.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
