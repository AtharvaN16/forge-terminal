name: audit

# Every Monday, and whenever the lockfile changes: does anything Forge ships
# to users have a known vulnerability? A failed run is GitHub's email to the
# repository owner. The fix is a dependency bump and a Forge patch release;
# the update check then tells users to reinstall, which brings the fix.
#
# --omit=dev: only what `npm i -g forge-terminal` installs. Dev dependencies
# never reach users; Dependabot alerts on the repository cover them.
# `npm audit` reads package-lock.json, so nothing is installed here.

on:
  schedule:
    - cron: '17 9 * * 1'
  push:
    branches: [dev, main]
    paths: [package.json, package-lock.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm audit --omit=dev --audit-level=low
